name: Bug Report
description: Report a bug or unexpected behavior
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Please fill out the details below.

  - type: input
    id: version
    attributes:
      label: TagOps version
      description: "Run `tagops --version` to find this."
      placeholder: "4.0.0"
    validations:
      required: true

  - type: input
    id: node-version
    attributes:
      label: Node.js version
      description: "Run `node -v` to find this."
      placeholder: "v20.11.0"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating System
      options:
        - macOS
        - Linux
        - Windows (WSL)
    validations:
      required: true

  - type: input
    id: command
    attributes:
      label: Command that failed
      placeholder: "tagops audit --json"
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: "Paste the full error output if applicable."
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: Additional context
      description: "Relevant .gtmrc.json config (redact IDs), screenshots, etc."
